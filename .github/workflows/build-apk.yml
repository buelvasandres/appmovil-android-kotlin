name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CatalogoExpress.apk

      - name: Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CatalogoExpress-apk
          path: CatalogoExpress.apk
